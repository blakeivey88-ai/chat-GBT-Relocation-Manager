<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#071d3b" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="description" content="Reset your Relocation Manager USA password." />
  <title>Reset Password · Relocation Manager USA</title>
  <link rel="canonical" href="https://relocationmanagerusa.com/reset-password" />
  <link rel="stylesheet" href="/styles.css?v=20260718-2" />
  <style>
    body{margin:0;background:linear-gradient(180deg,#071d3b 0%,#edf3f9 100%);font-family:Inter,system-ui,sans-serif;color:#172033}
    .wrap{min-height:100svh;display:grid;place-items:start center;padding:clamp(20px,4vw,56px) 16px 32px}
    .card{width:min(100%,560px);background:#fff;border:1px solid #dce6f0;border-radius:28px;box-shadow:0 28px 80px rgba(13,31,59,.12);padding:clamp(24px,3vw,38px);display:grid;gap:16px}
    .brand{color:#fff;display:flex;align-items:center;gap:12px;font-weight:950;font-size:clamp(24px,3vw,34px)}
    .brand .mark{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.12)}
    h1,h2,p{margin:0}
    .muted{color:#64748b;line-height:1.5}
    .form{display:grid;gap:12px}
    label{display:grid;gap:6px;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#5d6d82}
    input{min-height:48px;padding:12px 14px;border-radius:14px;border:1px solid #d8e2ee;background:#fbfdff;font-size:16px}
    input:focus{outline:3px solid rgba(29,78,216,.18);border-color:#7db1ff;background:#fff}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .row .btn{min-height:48px;border-radius:14px}
    .status{display:grid;gap:6px;border-radius:14px;padding:13px 15px;font-weight:750;display:none}
    .status[data-tone="info"]{background:#eef6ff;border:1px solid #cbdcf5;color:#123e77}
    .status[data-tone="success"]{background:#eaf7ef;border:1px solid #b9dfc6;color:#176835}
    .status[data-tone="error"]{background:#fff1f1;border:1px solid #f0bbbb;color:#9d1c1c}
    .footer{font-size:13px;color:#6b7b90;line-height:1.5}
    .spinner{width:14px;height:14px;border-radius:999px;border:2px solid currentColor;border-right-color:transparent;display:inline-block;animation:spin .8s linear infinite;vertical-align:-2px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="wrap">
    <div style="width:min(100%,560px);display:grid;gap:16px;">
      <div class="brand"><span class="mark">🦅</span><span>Relocation <b>Manager USA</b></span></div>
      <article class="card">
        <h1>Reset your password</h1>
        <p class="muted" id="resetInstructions">Use the secure link from your email to set a new password.</p>
        <form class="form" id="resetForm" novalidate>
          <label>Email address<input name="email" type="email" autocomplete="email" required placeholder="you@company.com" /></label>
          <label id="resetTokenField">Reset token<input name="resetToken" required placeholder="Paste your reset token" /></label>
          <label>New password<input name="newPassword" type="password" minlength="12" autocomplete="new-password" required placeholder="At least 12 characters" /></label>
          <label>Confirm new password<input name="confirmPassword" type="password" minlength="12" autocomplete="new-password" required placeholder="Type it again" /></label>
          <div class="row">
            <button class="btn btn-primary" type="submit"><span class="button-text">Reset password</span></button>
            <a class="btn btn-soft" href="/signin">Back to sign in</a>
          </div>
        </form>
        <div class="status" id="status" role="alert" aria-live="polite" aria-atomic="true"></div>
        <p class="footer">After you reset, we’ll securely sign you in and open your account.</p>
      </article>
    </div>
  </main>
  <script>
    const form=document.getElementById('resetForm');
    const statusBox=document.getElementById('status');
    const buttonText=form?.querySelector('.button-text');
    let csrfToken='';

    function showStatus(message,tone='info'){if(!statusBox) return;statusBox.style.display='grid';statusBox.dataset.tone=tone;statusBox.textContent=message;}
    function setBusy(next){const btn=form?.querySelector('button[type="submit"]');if(!btn) return;btn.disabled=next;if(buttonText) buttonText.innerHTML=next?'<span class="spinner" aria-hidden="true"></span> Resetting…':'Reset password';}
    async function seedCsrf(){try{const res=await fetch('/api/account',{credentials:'include'});const data=await res.json().catch(()=>null);if(data?.csrfToken) csrfToken=String(data.csrfToken||'');}catch{}}
    function safeInternalUrl(value){if(!value)return'';try{const next=new URL(value,location.origin);if(next.origin!==location.origin||/^\/api(\/|$)/i.test(next.pathname)||/^\/(signin|sign-in|login)(\.html)?$/i.test(next.pathname))return'';return`${next.pathname}${next.search}${next.hash}`}catch{return''}}
    function openAccount(data){const route=String(data?.dashboardRoute||'').trim();if(route==='admin'){location.replace('/admin.html');return}if(route==='verify'){location.replace('/index.html#verify');return}if(route==='profile-completion'){location.replace('/index.html#signup');return}if(route==='renewal'){location.replace('/account/billing?redirect=%2Fprofile');return}if(route==='plan-selection'){location.replace('/pricing');return}location.replace(safeInternalUrl(data?.redirectPath)||'/index.html#profile')}
    const params=new URLSearchParams(location.search);const linkToken=String(params.get('reset_token')||'').trim();const linkEmail=String(params.get('email')||'').trim();const tokenInput=form?.querySelector('[name="resetToken"]');const emailInput=form?.querySelector('[name="email"]');if(linkToken&&tokenInput){tokenInput.value=linkToken;document.getElementById('resetTokenField').style.display='none';document.getElementById('resetInstructions').textContent='Your secure reset link is ready. Create and confirm your new password.'}if(linkEmail&&emailInput)emailInput.value=linkEmail;
    form?.addEventListener('submit',async e=>{e.preventDefault();const email=String(form.querySelector('[name="email"]')?.value||'').trim();const resetToken=String(form.querySelector('[name="resetToken"]')?.value||'').trim();const newPassword=String(form.querySelector('[name="newPassword"]')?.value||'').trim();const confirmPassword=String(form.querySelector('[name="confirmPassword"]')?.value||'').trim();if(!email||!resetToken||!newPassword||!confirmPassword){showStatus('Fill in every field.','error');return}if(newPassword.length<12){showStatus('Use at least 12 characters for your new password.','error');return}if(newPassword!==confirmPassword){showStatus('The two passwords do not match.','error');return}setBusy(true);showStatus('Resetting password…');try{if(!csrfToken)await seedCsrf();if(!csrfToken)throw{error:'Could not start a secure reset session. Refresh the page and try again.'};let res=await fetch('/api/account',{method:'POST',credentials:'include',headers:{'content-type':'application/json','x-csrf-token':csrfToken},body:JSON.stringify({action:'reset-password',email,token:resetToken,password:newPassword})});let data=await res.json().catch(()=>null);if(res.status===403&&data?.csrfToken){csrfToken=String(data.csrfToken||'');res=await fetch('/api/account',{method:'POST',credentials:'include',headers:{'content-type':'application/json','x-csrf-token':csrfToken},body:JSON.stringify({action:'reset-password',email,token:resetToken,password:newPassword})});data=await res.json().catch(()=>null)}if(data?.csrfToken)csrfToken=String(data.csrfToken||'');if(!res.ok)throw data;showStatus('Password updated. Signing you in and opening your account…','success');form.reset();setTimeout(()=>openAccount(data),700)}catch(err){showStatus((err&&err.error)||'Could not reset the password right now.','error')}finally{setBusy(false)}});
    seedCsrf();
  </script>
</body>
</html>
